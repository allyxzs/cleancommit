<text x="367.5" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">git hooks</text>
<text y="58" xml:space="preserve"><tspan x="22.0" fill="#7ee787" font-weight="700">$</tspan><tspan x="38.9" fill="#c9d1d9">cleancommit hook install --with-msg</tspan></text>
<text y="79" xml:space="preserve"><tspan x="30.4" fill="#7ee787">✔</tspan><tspan x="47.3" fill="#c9d1d9" font-weight="700">pre-commit</tspan><tspan x="140.0" fill="#c9d1d9">criado</tspan><tspan x="199.0" fill="#6e7681">.git/hooks/pre-commit</tspan></text>
<text y="100" xml:space="preserve"><tspan x="30.4" fill="#7ee787">✔</tspan><tspan x="47.3" fill="#c9d1d9" font-weight="700">prepare-commit-msg</tspan><tspan x="207.5" fill="#c9d1d9">criado</tspan><tspan x="266.5" fill="#6e7681">.git/hooks/prepare-commit-msg</tspan></text>
<text y="121" xml:space="preserve"><tspan x="47.3" fill="#6e7681">Ignorar uma vez: git commit --no-verify  (ou CLEANCOMMIT_SKIP=1 git commit)</tspan></text>
<text y="163" xml:space="preserve"><tspan x="22.0" fill="#7ee787" font-weight="700">$</tspan><tspan x="38.9" fill="#c9d1d9">cleancommit hook status</tspan></text>
<text y="184" xml:space="preserve"><tspan x="30.4" fill="#7ee787">✔</tspan><tspan x="47.3" fill="#c9d1d9" font-weight="700">pre-commit</tspan><tspan x="140.0" fill="#c9d1d9">instalado</tspan><tspan x="224.3" fill="#6e7681">.git/hooks/pre-commit</tspan></text>
<text y="205" xml:space="preserve"><tspan x="30.4" fill="#7ee787">✔</tspan><tspan x="47.3" fill="#c9d1d9" font-weight="700">prepare-commit-msg</tspan><tspan x="207.5" fill="#c9d1d9">instalado</tspan><tspan x="291.8" fill="#6e7681">.git/hooks/prepare-commit-msg</tspan></text>
